name: switchScript

on:
  push:
    branches:
      - main
    paths:
      - 'switchScript.sh'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/switchScript.yaml'
  workflow_dispatch:
  schedule:
    # 16:17 Asia/Shanghai; avoid the busy start of the hour.
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: switchscript-release
  cancel-in-progress: false

env:
  SCRIPT_SH: switchScript.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt install -y jq

    - name: Validate script
      run: |
        bash -n switchScript.sh
        python3 -m unittest discover -s tests -v

    - name: "Build & Release"
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        echo "DATE=$(date "+%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "tag_name=$(date +%Y%m%d)" >> $GITHUB_ENV
        chmod +x $SCRIPT_SH
        ./$SCRIPT_SH --strict
        zip -rq SwitchSD.zip SwitchSD

    - name: Read description.txt
      id: description
      uses: juliangruber/read-file-action@v1
      with:
        path: ./description.txt

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.DATE }} ❤️ | 大气层个人整合包
        allowUpdates: true
        tag: ${{ env.tag_name }}
        commit: ${{ github.sha }}
        token: ${{ secrets.actions_release }}
        body: |
          Source commit: ${{ github.sha }}

          ${{ steps.description.outputs.content }}
        artifacts: "SwitchSD.zip"

    - name: Remove old Releases
      uses: jay2610/delete-older-releases@1.0.0
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.actions_release }}

    - name: Delete workflow runs for current repo
      uses: Mattraks/delete-workflow-runs@v2.1.0
      with:
        token: ${{ secrets.actions_release }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 6
